// ============================================================================
// eDIDIO S10 Protocol Buffer Structure
// Version 1.3.2
// ============================================================================
//
// This protocol defines the message format for communicating with eDIDIO
// lighting controllers manufactured by Control Freak.
//
// CONNECTION:
//   - Discovery: UDP broadcast on port 30303 (returns JSON with MAC, IP, firmware)
//   - Control: TCP (port 23) or TLS (port 443)
//   - Heartbeat: Send AytMessage (0xFF 0xF6) within 20 seconds to maintain connection
//
// MESSAGE FRAMING:
//   All messages are wrapped with:
//   - 1 byte:  Start marker (0xCD)
//   - 2 bytes: Message length (MSB, LSB) - length of the protobuf payload
//   - N bytes: Protobuf-encoded EdidioMessage
//
// USAGE:
//   All communication uses the EdidioMessage wrapper. Set the message_id field
//   (client-chosen, echoed in responses) and populate exactly one payload field.
//
//   Example - Turn on DALI Group 1:
//     EdidioMessage {
//       message_id: 1,
//       dali_message: DALIMessage {
//         line_mask: 0b0001,
//         address: 1,
//         command: DALI_MAX_LEVEL
//       }
//     }
//
// SUPPORTED PROTOCOLS:
//   - DALI (Digital Addressable Lighting Interface) - 16-bit and 24-bit
//   - DALI Type 8 (DT8) - Colour control (XY, Tc, RGBWAF)
//   - DMX512 - Entertainment lighting
//   - RDM - Remote Device Management over DMX
//
// ============================================================================

syntax = "proto3";

//package com.eds10pb; // Uncomment to enable IDE click-through navigation in generated code

// Machine-readable protocol version, exposed as a compile-time constant in every
// generated language (e.g. C/nanopb: ProtocolVersion_PROTOCOL_VERSION_CURRENT).
// Byte-packed as 0x00_MM_mm_PP (major<<16 | minor<<8 | patch), so 1.3.1 -> 0x010301.
// Monotonically increasing, so compare with >= for capability checks; each field 0-255.
// Keep in sync with the "// Version" line in the header above.
// Increase it with every change that alters the generated code (README: Versioning).
enum ProtocolVersion {
    PROTOCOL_VERSION_UNSPECIFIED = 0; // Required zero value; a device reporting 0 predates proto_version
    PROTOCOL_VERSION_CURRENT     = 0x010302; // 1.3.2
}

/*
 * Section banners: "/" + "*** @exclude <Section name> ***" + "/". The doc generator
 * (protoc-gen-doc) drops a comment holding @exclude, so the banner text itself stays out
 * of field descriptions - it does NOT hide the messages below it. The API reference is
 * grouped by these banners, in this order: a new type belongs under the right one.
 *
 * Reference tags - the API reference's "Requests and replies" tables are built from them:
 *   EdidioMessage payload fields:  "Reply: <payload field or AckMessage>." or "Sent by the device."
 *                                  and "Role: NONE|CONTROL|CONFIG|ADMIN." (login role needed)
 *   AdminPropertyType values:      "Commands: GET, SET." "Payload: <AdminMessage field>[.<field>]."
 *                                  and "Role: ..." - use "Payload: none." for RUN / RESET actions
 *   ReadType / DiagnosticMessageType values: "Reply: <EdidioMessage payload field>."
 */

/************ @exclude Shared enumerations ************/
// How an input or output behaves: momentary or latching, and whether it is enabled.
enum TriggerOperationType {
    MOMENTARY             = 0;   // A Short Press occurs when a button is pressed for less than 250ms (and at least 50ms). A Long Press occurs when a button is pressed for longer than 650ms. Holding the button down will repeat the Long Press action every 400ms.
    LATCHING              = 1;   // Instantaneous on short to ground (debounced to 50ms). Trigger occurs once upon entering this state (LOW) and once upon leaving this state (HIGH).
    MOMENTARY_OUTPUT      = 2;   // A temporary output signal
    LATCHING_OUTPUT       = 3;   // A continuous output signal
	ROTARY				  = 4;   // Rotary device, DALI input device
    MOMENTARY_DISABLED    = 128; // Used to track the enabled/disabled state of an I/O
    LATCHING_DISABLED     = 129; // Used to track the enabled/disabled state of an I/O
}


// What a trigger does (TriggerMessage.type): set DALI or DMX levels, start or stop lists, sequences and themes, change profiles, control sensors, and so on. target_index and value mean what each type says.
enum TriggerType {
	DALI_ARC                            = 0;    // For controlling DALI Arc Levels (0 to 254) and 255 for MASK
	DALI_COMMAND                        = 1;    // See (https://en.wikipedia.org/wiki/Digital_Addressable_Lighting_Interface#Commands_for_control_gear) for a list of common DALI commands
	DMX_CHANNELS_SPLIT_LOW              = 2;    // Sets DMX channel directly. Expects 1-based channel number (1-512)
	DMX_CHANNELS_SPLIT_HIGH             = 3;    // Sets DMX channel directly. Expects 1-based channel number (1-512)
	DMX_MULTICAST_CHANNELS_SPLIT_LOW    = 4;    // Sets DMX channel relative to the Zone's configured start address. Expects 0-based offset index
	DMX_MULTICAST_CHANNELS_SPLIT_HIGH   = 5;    // Sets DMX channel relative to the Zone's configured start address. Expects 0-based offset index
	DMX_BROADCAST                       = 6;    // Affects all DMX lights as per the Spektra Settings (number of lights and channels per light)
	DIDIO                               = 7;    // DEPRECATED
	FADE_UP_WITH_MIN                    = 8;    // DALI Fade Up Command - Query level and set Minimum if Off
	LIST_START                          = 9;    // Start a List action once
	LIST_START_CONTINUOUS               = 10;   // Start a List action with repeat 
	LIST_STOP                           = 11;   // Stop a List
	SPEKTRA_START_SEQ                   = 12;   // Start a Spektra Sequence
	SPEKTRA_STOP_SEQ                    = 13;   // Stop a playing Spektra Sequence
	SPEKTRA_THEME                       = 14;   // Apply a Spektra Theme
	SPEKTRA_STATIC                      = 15;   // DEPRECATED
	SPEKTRA_SCHEDULE                    = 16;   // Start the scheduled Spektra item
	LINK_START                          = 17;   // Enables the UDP Link State - If Configured
	LINK_STOP                           = 18;   // Temporarily disables the UDP Link State
	STOP_BURN_IN                        = 19;   // Stop a Burn-In
	START_BURN_IN                       = 20;   // Start a Burn-In
	ON_OFF_TOG                          = 21;   // Turn a Group/Address On/Off based on queried arc level. For DALI_GROUP_ALL (broadcast), uses internal toggle state flag
	MIN_MAX_TOG                         = 22;   // On/Off Toggle replaced by Min/Max
	ENABLE_INPUT                        = 23;   // Enable Input - If latching, Input will trigger immediately based on current state
	DISABLE_INPUT                       = 24;   // Disable Input
	ENABLE_TOG_INPUT                    = 25;   // Toggle Enable/Disable Input
	OUTPUT_TOG                          = 26;   // Toggle Output State between High (~22Vdc) and Low (0Vdc)
	OUTPUT_HIGH                         = 27;   // Set Output HIGH
	OUTPUT_LOW                          = 28;   // Set Output LOW
	OUTPUT_TRIG                         = 29;   // Set Output to trigger momentarily based on configuration
	PROFILE_CHANGE                      = 30;   // Change Profile - This action will reset sensor state
	FADE_LONG_PRESS                     = 31;   // Long Press Fade based on Toggle Flag
	SYNCRO                              = 32;   // Command sets clock to 11:59PM. Used for hardware time update by external Timeclock
	PRESET_CODE                         = 33;   // Preset Code - Executes a predefined action sequence stored on the device (index 0-N based on preset_code_count)
	CUSTOM_CODE                         = 34;   // Project Specific Custom Code - Contact Control Freak for support
    SPEKTRA_SLEEP                       = 35;   // Pause Spektra sequence
    SPEKTRA_RESUME                      = 36;   // Resume Spektra sequence
	DEVICE_RESET						= 37;   // Admin Command for Hardware Reset
	DEVICE_SAVE							= 38;   // Admin Command for manual device memory save
    USER_LEVEL_STORE_NEW                = 39;   // Store Current Level to Variable
    USER_LEVEL_SET_DEFAULT              = 40;   // Reset User Level Variable
    USER_LEVEL_RECALL                   = 41;   // Recall User Level Variable
    ROOM_JOIN                           = 43;   // DEPRECATED
    ROOM_UNJOIN                         = 44;   // DEPRECATED
	TYPE8_TC_WARMER					    = 45;   // DALI Type 8 Warmer Command. 1 Mirek increments
	TYPE8_TC_COOLER					    = 46;   // DALI Type 8 Cooler Command. 1 Mirek increments
	TYPE8_TC_ACTUAL					    = 47;   // DALI Type 8 Set Colour to Mirek value
	LOGIC_OPERATION                     = 48;   // Execute a conditional logic rule (see LogicMessage)
	ALARM_ENABLE						= 49;   // Enable Alarm at Index
	ALARM_DISABLE						= 50;   // Disable Alarm at Index
	DALI_CONTROL_SENSOR_OVERRIDE        = 51;	// Puts the DALI Sensor in 'override mode', which means it will no longer control the lighting until occupancy has timed-out or control is manually resumed
	DALI_CONTROL_SENSOR_TEMP_DISABLE    = 52;	// Sets the occupancy timer to zero and puts the DALI Sensor in a temporary 'disable mode' (duration depends on Sensor configuration: 'Disable Period')
	DALI_CONTROL_SENSOR_RESUME          = 53;	// Takes the DALI Sensor out of 'override mode'
	DALI_ARC_OVERRIDE                   = 54;	// For controlling DALI Arc Levels (0 to 254) and 255 for MASK - Sets associated group to override mode
	DALI_COMMAND_OVERRIDE               = 55;   // For sending DALI commands - Sets associated group to override mode
    FADE_UP_WITH_MIN_OVERRIDE           = 56;   // Non-native DALI command override (sets associated group to override mode)
    ON_OFF_TOG_OVERRIDE                 = 57;   // Non-native DALI command override (sets associated group to override mode)
    MIN_MAX_TOG_OVERRIDE                = 58;   // Non-native DALI command override (sets associated group to override mode)
    MAX_OFF_TOG                         = 59;   // Reserved - Toggle between MAX level and OFF
    MAX_OFF_TOG_OVERRIDE                = 60;   // Reserved - Toggle between MAX level and OFF with sensor override
    FADE_LONG_PRESS_OVERRIDE            = 61;   // Non-native DALI command override (sets associated group to override mode)
    USER_LEVEL_RECALL_OVERRIDE          = 62;   // Non-native DALI command override (sets associated group to override mode)
	DMX_ZONE_FADE_UP					= 63;   // DMX Spektra Zone Fade UP
	DMX_ZONE_FADE_DOWN					= 64;   // DMX Spektra Zone Fade DOWN
	LOGGING_LEVEL						= 65;	// Enable Logging to EEPROM to be read by configurator
    SPEKTRA_SHOW_CONTROL                = 66;   // DEPRECATED
    CIRCADIAN_TEMPERATURE               = 67;   // Automatically adjusts DALI Type 8 colour temperature based on time of day (warmer in morning/evening, cooler midday)
    DALI_CONTROL_SENSOR_MUTE            = 68;   // Mute Sensor at Index (or all with Index 255)
    DALI_CONTROL_SENSOR_UNMUTE          = 69;   // Unmute to Sensor at Index (or all with Index 255)
    SPEKTRA_INTENSITY                   = 70;   // Allow you to specify the maximum Spektra Sequence or Theme output intensity (10 to 100)%
    ENABLE_INPUT_NO_ACTION              = 71;   // Allow you to enable an input (Latching), but not trigger the action.
    SET_DALI_FADE_TIME                  = 72;   // Sets the DALI Fade Time
    NO_COMMAND                          = 254;  // This TriggerType should always be at the bottom of the list. Add any new TriggerTypes above it (up to 253).

}

// What a read_device request reads. Each value says which EdidioMessage payload comes back. Also used to say where an event came from.
enum ReadType {
    INPUTS                  = 0;  // The physical inputs of one profile (profile). Reply: inputs.
    OUTPUTS                 = 1;  // The outputs of one profile (profile). Reply: outputs.
    IR                      = 2;  // The IR codes of one profile (profile; deprecated). Reply: irs.
    SENSOR                  = 3;  // One sensor (index) of one profile (profile). Reply: sensor.
    // DEPRECATED: SENSORS  (4)     // This was removed because it could potentially exceed buffer size limits

    LIST                    = 5;  // One list (index): its first 32 steps. Reply: list.
    // DEPRECATED: LISTS    (6)     // This was removed because it could potentially exceed buffer size limits

    ALARMS                  = 7;  // Every alarm. Reply: alarms.
    BURN_IN                 = 8;  // Every burn-in. Reply: burn_ins.
    PROJECT                 = 9;  // Not supported - use AdminMessage SYSTEM_PROPERTIES. Reply: AckMessage (INDEX_OUT_OF_BOUNDS).
    NETWORK                 = 10; // Not supported - use AdminMessage NETWORK_PROPERTIES. Reply: AckMessage (INDEX_OUT_OF_BOUNDS).
    DEVICE                  = 11; // Not supported - use diag_message DIAGNOSTIC_SYSTEM_INFO. Reply: AckMessage (INDEX_OUT_OF_BOUNDS).
    POLL_DATA               = 12; // Not supported - use diag_message DALI_LEVEL_CACHE. Reply: AckMessage (INDEX_OUT_OF_BOUNDS).
    LIST_EXTENDED           = 13; // Steps beyond the first 32 of one list (index), from block secondary_index. Reply: list_extended.
	LOGIC	                = 14; // Every logic rule. Reply: logic_message.
	DALI_INPUTS             = 15; // The DALI inputs of one profile (profile). Reply: inputs_dali.
    DMX_TRANSLATIONS        = 16; // Every DMX to DALI translation object. Reply: dmx_translator.
}

// Whether an alarm repeats. Which days it runs on comes from repeat_day_bitmask and repeat_month_bitmask.
enum AlarmRepeatType {
    ALARM_NO_REPEAT         = 0; // Once, on the date in start_time
    ALARM_REPEAT_DAILY      = 1; // Repeats - on the weekdays in repeat_day_bitmask and months in repeat_month_bitmask (set all days)
    ALARM_REPEAT_WORK_DAY   = 2; // Repeats - on the weekdays in repeat_day_bitmask (set Monday to Friday)
    ALARM_REPEAT_WEEKLY     = 3; // Repeats - on the weekday(s) in repeat_day_bitmask
    ALARM_REPEAT_MONTHLY    = 4; // Repeats - in the months in repeat_month_bitmask. The firmware treats every type but NO_REPEAT alike: the bitmasks decide
}

// Whether an alarm's start or end is a clock time, or sunrise / sunset with the time as an offset.
enum AlarmAstroType {
    ALARM_NO_ASTRO  = 0; // At the clock time given
    ALARM_SUNRISE   = 1; // At sunrise (from LATITUDE / LONGITUDE), moved by the time given as an offset
    ALARM_SUNSET    = 2; // At sunset, moved by the time given as an offset
}

// Which kind of Spektra data a request or action is about.
enum SpektraTargetType {
    SETTINGS        = 0; // A zone's settings (SpektraSettingMessage)
    SEQUENCE        = 1; // A stored sequence
    THEME           = 2; // A stored theme
    STATIC          = 3;        // DEPRECATED
	CALENDAR        = 4; // The calendar
    SHOW            = 5;        // DEPRECATED
    LIVE            = 6;        // Live Update of the Spektra settings
}

// What to do with a sequence or theme (SpektraControlMessage).
enum SpektraActionType {
    START  = 0; // Start playing
    STOP   = 1; // Stop
    PAUSE  = 2; // Pause, keeping the current colours
    SAVE   = 3; // Save the Spektra data (settings, calendar) to non-volatile memory
}

// What a Spektra step does.
enum SpektraStepActionType {
    RUN_SEQUENCE    = 0; // Run a sequence
    SHOW_THEME      = 1; // Show a theme
    START_LIST      = 2; // Start a list
    PAUSE_PREVIOUS  = 3; // Pause what the previous step started
    STOP_PREVIOUS   = 4; // Stop what the previous step started
}

// What a Spektra zone does on a day the calendar gives it nothing.
enum SpektraUnscheduledBehaviourType {
    RUN_RANDOM_COLOURED_SEQUENCE    = 0;   // Unless otherwise specified, this is a rotate sequence with random colours rotating every 5 seconds
    RUN_SEQUENCE_1                  = 1;   // Can be used to set a 'Default Sequence' with a known pattern and colour combination
    RESUME_PREVIOUS                 = 2;   // Resume the last Sequence or Theme that Spektra had active
    RUN_THEME_1                     = 3;   // Resume to Theme 1
    RUN_SHOW_1                      = 4;   // Resume to Show 1 
    DO_NOTHING                      = 254; // Left as the last possible type, fill between 0 and 253 as necessary
}

// How DMX addresses count across lines.
enum LineAddressingType {
    INDEPENDENT = 0;    // Control Lines are independently addressed (e.g. DMX 1 to 512 per line)
    CONSECUTIVE = 1;    // Control Lines are consecutively addressed (e.g. DMX 1 to 512 on the first line, 513 to 1024 on the next, etc.)
}

// The result in an AckMessage: SUCCESS, or why the request was not done.
enum AckMessageType {
    DECODE_FAILED                  = 0;  // May indicate an issue with the protocol (e.g. a mismatch in expected fields between clients). Ensure both parties are using the latest version.
    INDEX_OUT_OF_BOUNDS            = 1;  // A resource was requested beyond the amount available.
    UNEXPECTED_TYPE                = 2;  // The provided message was not able to be handled or processed (likely due to a lack of enough information or incorrect values).
    ENCODE_FAILED                  = 3;  // Not currently in use.
    KEY_MISMATCH                   = 4;  // Not currently in use.
    SUCCESS                        = 5;  // The message was decoded and handled successfully.
    INVALID_PARAMS                 = 6;  // The message was decoded but had invalid data for the intended outcome.
    UNEXPECTED_COMMAND             = 7;  // The message was decoded but the requested action was not valid for current the state of the device.
    COMMUNICATION_FAILED           = 8;  // The message could not be received or sent due to an internal issue.
    COMMUNICATION_TIMEOUT          = 9;  // May indicate contention for a shared resource or that an existing task is taking longer than expected and the latest request has timed-out.
    DATA_TOO_LONG                  = 10; // May indicate too much data was in the request or the required reply would be too big to handle.
    UNEXPECTED_CASE                = 11; // May indicate that the message is out of context (e.g. an "end" command for a process that is not running) or that the message requests a feature that is not yet implemented.
    SLOTS_FULL                     = 12; // Typically indicates that a request was valid, but the relevant content is "full" and thus elements must be removed before continuing.
    UNAUTHORISED                   = 13; // The message could not be actioned because the connection has not been authorised.
    PARTIAL_SUCCESS                = 14; // Can be returned in the case where some but not all Lines in a line_mask successfully sent
    COMMAND_FAILED                 = 15; // For whatever reason, the intended command did not complete
    DEPRECATED                     = 16; // For message which is no longer supported by this Firmware
    FORBIDDEN                      = 17; // The connection is authenticated but its role lacks the clearance required for this operation (distinct from UNAUTHORISED, which means not authenticated at all).
}

// Standard DALI Type 8 Commands - See DALI Standard
enum Type8CommandType {
    SET_TEMP_X_COORD                     = 0; // IEC 62386-209 command 224: SET TEMPORARY X-COORDINATE (DTR1:DTR0)
    SET_TEMP_Y_COORD                     = 1; // IEC 62386-209 command 225: SET TEMPORARY Y-COORDINATE (DTR1:DTR0)
    ACTIVATE                             = 2; // IEC 62386-209 command 226: ACTIVATE - apply the temporary colour
    X_COORD_STEP_UP                      = 3;   // Activate Not Required
    X_COORD_STEP_DOWN                    = 4;   // Activate Not Required
    Y_COORD_STEP_UP                      = 5;   // Activate Not Required
    Y_COORD_STEP_DOWN                    = 6;   // Activate Not Required
    SET_TEMP_COLOUR_TEMPERATURE          = 7;   // DTR1 | DTR as Mirek Value
    COLOUR_TEMPERATURE_STEP_COOLER       = 8;   // Activate Not Required
    COLOUR_TEMPERATURE_STEP_WARMER       = 9;   // Activate Not Required
    SET_TEMP_PRI_N_DIMLEVEL              = 10; // IEC 62386-209 command 234: SET TEMPORARY PRIMARY N DIMLEVEL (DTR1:DTR0, primary N in DTR2)
    SET_TEMP_RGB_DIMLEVEL                = 11; // IEC 62386-209 command 235: SET TEMPORARY RGB DIMLEVEL (DTR0, DTR1, DTR2)
    SET_TEMP_WAF_DIMLEVEL                = 12; // IEC 62386-209 command 236: SET TEMPORARY WAF DIMLEVEL (DTR0, DTR1, DTR2)
    SET_TEMP_RGBWAF_CONTROL              = 13; // IEC 62386-209 command 237: SET TEMPORARY RGBWAF CONTROL (DTR0)
    COPY_REPORT_TEMPORARY                = 14; // IEC 62386-209 command 238: COPY REPORT TO TEMPORARY
    STORE_TY_PRI_N                       = 16; // IEC 62386-209 command 240: STORE TY PRIMARY N (DTR1:DTR0, N in DTR2)
    STORE_XY_COORD_PRI_N                 = 17; // IEC 62386-209 command 241: STORE XY-COORDINATE PRIMARY N (N in DTR2)
    STORE_COLOUR_TEMPERATURE_LIMIT       = 18; // IEC 62386-209 command 242: STORE COLOUR TEMPERATURE TC LIMIT (DTR1:DTR0, which limit in DTR2)
    STORE_GEAR_FEATURES_STATUS           = 19; // IEC 62386-209 command 243: STORE GEAR FEATURES / STATUS (DTR0)
    ASSIGN_COLOR_LINKED_CH               = 21; // IEC 62386-209 command 245: ASSIGN COLOUR TO LINKED CHANNEL (DTR0)
    START_AUTO_CAL                       = 22; // IEC 62386-209 command 246: START AUTO CALIBRATION
    ENABLE_DEVICE_TYPE8                  = 48; // ENABLE DEVICE TYPE 8 (special command C1 08) - sent before each DT8 command
    SET_XY_COORDINATE                    = 50;  // Manufacturer Specific combined XY command
}

// Standard DALI Type 8 Queries - See DALI Standard
enum Type8QueryType {
    TYPE8_QUERY_NULL                  = 0; // Required as the first "default" element for the Protocol. Will not perform any action.
    TYPE8_QUERY_GEAR_FEATURES_STATUS  = 1;        // 247
    TYPE8_QUERY_COLOUR_STATUS         = 2;        // 248
    TYPE8_QUERY_COLOUR_TYPE_FEATURES  = 3;        // 249
    TYPE8_QUERY_COLOUR_VALUE          = 4;        // 250
    TYPE8_QUERY_RGBWAF_CONTROL        = 5;        // 251
    TYPE8_QUERY_ASSIGNED_COLOUR       = 6;        // 252
    TYPE8_QUERY_EXT_VERSION_NUM       = 8;        // 254
}

// Standard DALI 24 Bit Commands - See DALI Standard
enum DALI24DeviceSetting {
    COMMAND_IDENTIFY					= 0x00; // IEC 62386-103 opcode 0x00: IDENTIFY DEVICE
    COMMAND_RESET_POWER_CYCLE_SEEN		= 0x01; // IEC 62386-103 opcode 0x01: RESET POWER CYCLE SEEN
    COMMAND_RESET						= 0x10; // IEC 62386-103 opcode 0x10: RESET
    COMMAND_RESET_MEMORY_BANK			= 0x11; // IEC 62386-103 opcode 0x11: RESET MEMORY BANK (DTR0)
    COMMAND_SET_SHORT_ADDRESS			= 0x14; // IEC 62386-103 opcode 0x14: SET SHORT ADDRESS (DTR0)
    COMMAND_ENABLE_WRITE_MEMORY			= 0x15; // IEC 62386-103 opcode 0x15: ENABLE WRITE MEMORY
    COMMAND_ENABLE_APP_CONTROLLER		= 0x16; // IEC 62386-103 opcode 0x16: ENABLE APPLICATION CONTROLLER
    COMMAND_DISABLE_APP_CONTROLLER		= 0x17; // IEC 62386-103 opcode 0x17: DISABLE APPLICATION CONTROLLER
    COMMAND_SET_OPERATING_MODE			= 0x18; // IEC 62386-103 opcode 0x18: SET OPERATING MODE (DTR0)
    COMMAND_ADD_TO_DEVICE_GROUPS_0_15	= 0x19; // IEC 62386-103 opcode 0x19: ADD TO DEVICE GROUPS 0-15 (DTR2:DTR1)
    COMMAND_ADD_TO_DEVICE_GROUPS_15_32	= 0x1A; // IEC 62386-103 opcode 0x1A: ADD TO DEVICE GROUPS 16-31 (DTR2:DTR1)
    COMMAND_REMOVE_FROM_GROUPS_0_15		= 0x1B; // IEC 62386-103 opcode 0x1B: REMOVE FROM DEVICE GROUPS 0-15 (DTR2:DTR1)
    COMMAND_REMOVE_FROM_GROUPS_16_32	= 0x1C; // IEC 62386-103 opcode 0x1C: REMOVE FROM DEVICE GROUPS 16-31 (DTR2:DTR1)
    COMMAND_START_QUIESCENT_MODE		= 0x1D; // IEC 62386-103 opcode 0x1D: START QUIESCENT MODE
    COMMAND_STOP_QUIESCENT_MODE			= 0x1E; // IEC 62386-103 opcode 0x1E: STOP QUIESCENT MODE
    COMMAND_ENABLE_POWER_CYCLE_NOTIF	= 0x1F; // IEC 62386-103 opcode 0x1F: ENABLE POWER CYCLE NOTIFICATION
    COMMAND_DISABLE_POWER_CYCLE_NOTIF	= 0x20; // IEC 62386-103 opcode 0x20: DISABLE POWER CYCLE NOTIFICATION
    COMMAND_SAVE_PERSISTENT_VARIABLES	= 0x21; // IEC 62386-103 opcode 0x21: SAVE PERSISTENT VARIABLES
    SET_EVENT_PRIORITY					= 0x61; // IEC 62386-103 opcode 0x61: instance command SET EVENT PRIORITY (DTR0)
    ENABLE_INSTANCE						= 0x62; // IEC 62386-103 opcode 0x62: instance command ENABLE INSTANCE
    DISABLE_INSTANCE					= 0x63; // IEC 62386-103 opcode 0x63: instance command DISABLE INSTANCE
    SET_PRIMARY_INSTANCE_GROUP			= 0x64; // IEC 62386-103 opcode 0x64: instance command SET PRIMARY INSTANCE GROUP (DTR0)
    SET_INSTANCE_GROUP_1				= 0x65; // IEC 62386-103 opcode 0x65: instance command SET INSTANCE GROUP 1 (DTR0)
    SET_INSTANCE_GROUP_2				= 0x66; // IEC 62386-103 opcode 0x66: instance command SET INSTANCE GROUP 2 (DTR0)
    SET_EVENT_SCHEME					= 0x67; // IEC 62386-103 opcode 0x67: instance command SET EVENT SCHEME (DTR0)
    SET_EVENT_FILTER					= 0x68; // IEC 62386-103 opcode 0x68: instance command SET EVENT FILTER (DTR2:DTR1:DTR0)
}

// Standard DALI 24 Bit Instance Types - See DALI Standard
enum DALI24InstanceType {
    DEFAULT				= 0x00; // Not an instance type: no instance selected
    INPUT				= 0x01; // IEC 62386-301 push button
    ROTARY_INPUT        = 0x02; // IEC 62386-302 absolute input (slider, rotary, switch)
    MOTION_SENSOR 		= 0x03; // IEC 62386-303 occupancy sensor
    LIGHT_SENSOR	    = 0x04; // IEC 62386-304 light sensor
}

// Standard DALI 24 Bit Device Op Codes - See DALI Standard
enum DALI24OpCode {
    OPCODE_NULL				                    = 0x00; // No Action
    // Motion Sensor
    SENSOR_MOTION_SET_HOLD_TIMER				= 0x21;
    SENSOR_MOTION_SET_REPORT_TIMER				= 0x22; // IEC 62386-303 SET REPORT TIMER (DTR0)
    SENSOR_MOTION_SET_DEADTIME_TIMER			= 0x23; // IEC 62386-303 SET DEADTIME TIMER (DTR0)
