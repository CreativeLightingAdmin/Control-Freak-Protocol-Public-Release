    NTP_MAX_ACCEPTABLE_DELTA_SECONDS  = 45; // GET/SET. NTP corrections whose |delta| exceeds this value are rejected (treated as a sanity-check failure). Default 3600 (1 hour). Persisted in BKPSRAM.
    TIME_DIAG_MEASURE_LSE             = 46; // RUN. Triggers an on-demand LSE-vs-HSE ppm measurement (~250 ms). Result is cached and returned on the next GET TIME_DIAGNOSTICS.
    BACKUP_DOMAIN_RESET_CANARY        = 47; // RUN. Resets the boots_since_last_backup_loss counter to 0. Use after a deliberate battery replacement so the counter reflects only post-replacement boots.
